<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a237e">
<title>PokeVal : Scanner & Tracker Carte</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card-hover: #334155;
  --ink: #f8fafc;
  --mut: #94a3b8;
  --line: #334155;
  --acc: #ef4444;
  --acc-hover: #dc2626;
  --sec: #3b82f6;
  --ok: #10b981;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 16px; max-width: 680px; margin-inline: auto;
  background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, sans-serif;
}

header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
h1 { font-size: 1.4rem; font-weight: 700; margin: 0; display: flex; align-items: center; gap: 8px; }

.card-panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 12px;
  padding: 14px; margin-bottom: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3);
}

button, .btn, input, select {
  font: inherit; color: inherit; border: 1px solid var(--line);
  border-radius: 8px; padding: 10px 14px; background: var(--card); transition: all .15s ease;
}
button, .btn { cursor: pointer; font-weight: 600; }
button:active { transform: scale(0.98); }

.pri { background: var(--acc); border-color: var(--acc); color: #fff; display: block; text-align: center; }
.pri:hover { background: var(--acc-hover); }
.sec { background: var(--sec); border-color: var(--sec); color: #fff; }

.row { display: flex; gap: 8px; margin: 8px 0; flex-wrap: wrap; }
.row input { flex: 1; min-width: 120px; }

#cam {
  position: relative; margin-top: 10px; height: 260px;
  background: #000; border-radius: 10px; overflow: hidden;
}
#v { width: 100%; height: 100%; object-fit: cover; }
#overlay {
  position: absolute; inset: 0; border: 2px solid rgba(255,255,255,0.2);
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 15px;
}
#target-box {
  width: 75%; height: 50px; border: 2px dashed var(--acc);
  background: rgba(239, 68, 68, 0.2); border-radius: 6px; pointer-events: none;
}

#st { font-size: 0.85rem; color: var(--mut); margin: 6px 0; min-height: 1.4em; }

.c-item {
  display: flex; gap: 12px; align-items: center; background: var(--card);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px; margin: 8px 0;
}
.c-item img { width: 54px; height: 75px; object-fit: contain; border-radius: 4px; background: #000; }
.c-item .info { flex: 1; }
.c-item .title { font-weight: 700; font-size: 0.95rem; }
.badge { display: inline-block; font-size: 0.75rem; padding: 2px 6px; border-radius: 4px; background: var(--line); color: var(--mut); }

.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 16px; text-align: center;
}
.stat-val { font-size: 1.1rem; font-weight: 700; color: var(--ok); }
.stat-lbl { font-size: 0.75rem; color: var(--mut); }

table { width: 100%; border-collapse: collapse; background: var(--card); border-radius: 10px; overflow: hidden; }
td, th { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; font-size: 0.85rem; }
td input, td select { padding: 4px 6px; width: 100%; font-size: 0.85rem; }
td input[type="number"] { width: 75px; }

@media print { body { background: #fff; color: #000; } .no { display: none !important; } }
</style>
</head>
<body>

<header>
  <h1>🎴 PokeVal</h1>
  <span id="pwa-status" class="badge">Scanner Carte</span>
</header>

<div class="no">
  <div class="card-panel">
    <label class="btn pri">📷 Scatta / Carica Foto
      <input id="f" type="file" accept="image/*" capture="environment" hidden>
    </label>
    <button id="live" class="sec" style="width:100%; margin-top:8px">🎥 Scansione Live</button>

    <div id="cam" hidden>
      <video id="v" autoplay playsinline muted></video>
      <div id="overlay">
        <div id="target-box"></div>
      </div>
    </div>

    <p id="st">Inquadra il numero in basso a sinistra/destra della carta (es. 025/165).</p>

    <div class="row">
      <input id="n" placeholder="Nome carta (Inglese)">
      <input id="num" placeholder="Numero es. 025/165">
      <button id="go" class="pri">Cerca</button>
    </div>
  </div>

  <div id="res"></div>
</div>

<div class="stats-grid">
  <div><div id="st-qty" class="stat-val">0</div><div class="stat-lbl">Carte</div></div>
  <div><div id="st-mkt" class="stat-val">0.00 €</div><div class="stat-lbl">Valore Mercato</div></div>
  <div><div id="st-tot" class="stat-val">0.00 €</div><div class="stat-lbl">Totale Vendita</div></div>
</div>

<h2>La Mia Collezione</h2>
<table>
  <thead>
    <tr><th>Carta</th><th>Cond.</th><th>Mercato</th><th>Prezzo</th><th class="no"></th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<div class="row no" style="margin-top:16px">
  <button id="csv">Esporta CSV</button>
  <button id="pdf">Stampa PDF</button>
  <button id="clr" style="margin-left:auto; border-color:var(--acc); color:var(--acc)">Svuota</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const eur=v=>v==null||isNaN(v)?'—':Number(v).toFixed(2)+' €';
let L=[];
try{L=JSON.parse(localStorage.getItem('pkm_collection')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('pkm_collection',JSON.stringify(L))}catch(e){}draw()};

// API Key per AI se disponibile nel codice (opzionale)
const AI_API_KEY = ""; 

/* ---------- OCR / Processamento Immagine ---------- */
let W=null;
async function getWorker(){
  if(!W){
    W=await Tesseract.createWorker('eng');
    await W.setParameters({
      tessedit_char_whitelist:'0123456789/',
      tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE
    });
  }
  return W;
}

function otsuBinarize(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const hist = new Array(256).fill(0);
  for (let i = 0; i < data.length; i += 4) {
    const g = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    data[i] = data[i+1] = data[i+2] = g;
    hist[g]++;
  }
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, wF = 0, varMax = 0, thresh = 128, total = w * h;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (wB === 0) continue;
    wF = total - wB; if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * Math.pow(mB - mF, 2);
    if (v > varMax) { varMax = v; thresh = t; }
  }
  for (let i = 0; i < data.length; i += 4) {
    const val = data[i] >= thresh ? 255 : 0;
    data[i] = data[i+1] = data[i+2] = val;
  }
  ctx.putImageData(imgData, 0, 0);
}

function cropAndPrep(src, sw, sh) {
  // Prende la fascia inferiore dove solitamente risiede il numero di serie
  const cw = sw * 0.8, ch = sh * 0.25;
  const scale = Math.max(2, 300 / ch);
  const c = document.createElement('canvas');
  c.width = Math.round(cw * scale); c.height = Math.round(ch * scale);
  const x = c.getContext('2d', {willReadFrequently: true});
  x.imageSmoothingEnabled = false;
  x.drawImage(src, sw * 0.1, sh * 0.70, cw, ch, 0, 0, c.width, c.height);
  otsuBinarize(x, c.width, c.height);
  return c;
}

async function readNum(src, sw, sh) {
  const w = await getWorker();
  const cvs = cropAndPrep(src, sw, sh);
  const res = await w.recognize(cvs);
  const clean = res.data.text.replace(/\s+/g, '');
  const match = clean.match(/(\d{1,3})\/(\d{2,3})/);
  return { k: match ? `${match[1]}/${match[2]}` : '', t: clean };
}

/* ---------- Gestione Scatto Foto ---------- */
$('f').onchange = async e => {
  const file = e.target.files[0]; if (!file) return;
  $('st').textContent = 'Analisi immagine in corso…';
  try {
    const bmp = await createImageBitmap(file);
    const r = await readNum(bmp, bmp.width, bmp.height);
    if (r.k) {
      $('num').value = r.k;
      $('st').textContent = 'Numero letto: ' + r.k;
      search();
    } else {
      $('st').textContent = 'Lettura automatica incerta. Verifica il numero inserito.';
    }
  } catch (err) { $('st').textContent = 'Errore durante l\'analisi: ' + err.message; }
  e.target.value = '';
};

/* ---------- Ricerca TCGdex API ---------- */
let SETS = null;
async function fetchJSON(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}

async function search(){
  const name = $('n').value.trim();
  const m = $('num').value.match(/(\d+)\s*\/\s*(\d+)/);
  if (!m && !name) { $('st').textContent = 'Inserisci un nome o un numero valido.'; return; }$('res').textContent = 'Ricerca nel database Pokémon…';
  const BASE = 'https://api.tcgdex.net/v2/en/';
  
  try {
    let cards = [];
    if (m) {
      if (!SETS) SETS = await fetchJSON(BASE + 'sets') || [];
      const cardNum = +m[1], totalNum = +m[2];
      const matchingSets = SETS.filter(s => s.cardCount && (s.cardCount.official === totalNum || s.cardCount.total === totalNum));
      cards = (await Promise.all(matchingSets.map(async s => {
        for (const id of [String(cardNum).padStart(3, '0'), String(cardNum)]) {
          const c = await fetchJSON(BASE + 'cards/' + s.id + '-' + id);
          if (c) return c;
        }
        return null;
      }))).filter(Boolean);
    } else {
      const list = await fetchJSON(BASE + 'cards?name=' + encodeURIComponent(name) + '&pagination:page=1&pagination:itemsPerPage=10') || [];
      cards = (await Promise.all(list.map(c => fetchJSON(BASE + 'cards/' + c.id)))).filter(Boolean);
    }

    $('res').innerHTML = cards.length ? '' : '<p class="stat-lbl">Nessuna carta trovata. Prova a cercare inserendo solo il nome in inglese.</p>';
    
    cards.forEach(c => {
      const cm = (c.pricing && c.pricing.cardmarket) || {};
      const price = cm.trend ?? cm['trend-holo'] ?? 0;
      const setTotal = c.set && c.set.cardCount ? c.set.cardCount.official : '?';
      
      const el = document.createElement('div');
      el.className = 'c-item';
      el.innerHTML = `
        <img src="${c.image ? c.image + '/low.webp' : ''}" alt="${c.name}">
        <div class="info">
          <div class="title">${c.name}</div>
          <span class="badge">${c.set ? c.set.name : ''} · ${c.localId}/${setTotal}</span>
          <div style="margin-top:4px; font-weight:600; color:var(--ok)">Valore: ${eur(price)}</div>
        </div>
        <button class="pri">Aggiungi</button>
      `;
      el.querySelector('button').onclick = () => {
        L.push({ name: c.name, set: c.set ? c.set.name : '', num: c.localId + '/' + setTotal, cond: 'NM', mkt: price, val: price });
        save();
        $('st').textContent = c.name + ' aggiunta alla collezione!';
      };
      $('res').append(el);
    });
  } catch (err) { $('res').textContent = 'Errore di connessione: ' + err.message; }
}
$('go').onclick = search;

/* ---------- Scansione Video Live ---------- */
let stream = null, timer = 0, busy = false, lastRead = '';
function stopLive(){
  clearInterval(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; lastRead = ''; $('cam').hidden = true; $('live').textContent = '🎥 Scansione Live';
}

$('live').onclick = async () => {
  if (stream) { stopLive(); return; }
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }
    });
  } catch (e) { $('st').textContent = 'Fotocamera non disponibile: ' + e.message; return; }
  
  const v = $('v'); $('cam').hidden = false; $('live').textContent = '⏹ Interrompi';
  v.srcObject = stream; await v.play();
  
  $('st').textContent = 'Posiziona il numero di carta nel rettangolo rosso.';
  try { await getWorker(); } catch(e) { stopLive(); return; }
  
  timer = setInterval(async () => {
    if (busy || !stream || !v.videoWidth) return;
    busy = true;
    try {
      const r = await readNum(v, v.videoWidth, v.videoHeight);
      if (r.k && r.k !== lastRead) {
        lastRead = r.k;
        if (navigator.vibrate) navigator.vibrate(60);
        $('num').value = r.k;
        $('st').textContent = 'Letto: ' + r.k;
        search();
      }
    } catch(e) {}
    busy = false;
  }, 700);
};

/* ---------- Render Lista e Statistiche ---------- */
function draw() {
  $('list').innerHTML = '';
  let sumMkt = 0, sumVal = 0;
  
  L.forEach((c, i) => {
    sumMkt += (c.mkt || 0);
    sumVal += (c.val || 0);
    
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${c.name}</b><br><span class="badge">${c.set} ${c.num}</span></td>
      <td>
        <select>
          ${['NM','EX','GD','PL','PO'].map(x => `<option ${x === c.cond ? 'selected' : ''}>${x}</option>`).join('')}
        </select>
      </td>
      <td>${eur(c.mkt)}</td>
      <td><input type="number" step="0.5" value="${c.val ?? ''}"></td>
      <td class="no"><button style="padding:4px 8px; border-color:transparent">✕</button></td>
    `;
    tr.querySelector('select').onchange = e => { c.cond = e.target.value; save(); };
    tr.querySelector('input').onchange = e => { c.val = e.target.value === '' ? null : +e.target.value; save(); };
    tr.querySelector('button').onclick = () => { L.splice(i, 1); save(); };
    $('list').append(tr);
  });
  
  $('st-qty').textContent = L.length;
  $('st-mkt').textContent = eur(sumMkt);$('st-tot').textContent = eur(sumVal);
}

/* ---------- Export CSV & PDF ---------- */
$('csv').onclick = () => {
  const rows = [['Nome Carta', 'Set', 'Numero', 'Condizione', 'Prezzo Mercato', 'Prezzo Vendita'], ...L.map(c => [c.name, c.set, c.num, c.cond, c.mkt ?? '', c.val ?? ''])];
  const csvStr = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csvStr], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.URL.createObjectURL(blob); a.download = 'Collezione_Pokemon.csv'; a.click();
};
$('pdf').onclick = () => print();$('clr').onclick = () => { if (confirm('Vuoi davvero cancellare tutta la collezione salvata?')) { L = []; save(); } };

draw();
</script>
</body>
</html>
