<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>PokeVault Zero — Turbo Stream</title>
<style>
:root {
  --bg: #030712;
  --card-bg: rgba(17, 24, 39, 0.75);
  --border: rgba(255, 255, 255, 0.1);
  --ink: #f9fafb;
  --mut: #9ca3af;
  --gold: #fbbf24;
  --gold-glow: rgba(251, 191, 36, 0.35);
  --red: #ef4444;
  --green: #10b981;
  --blue: #3b82f6;
  --radius: 16px;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

body {
  margin: 0; padding: 16px; max-width: 760px; margin-inline: auto;
  background: var(--bg); color: var(--ink);
  background-image: 
    radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.12) 0px, transparent 50%);
  background-attachment: fixed;
  font: 15px/1.5 system-ui, -apple-system, sans-serif;
}

header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 16px; padding: 14px 18px;
  background: var(--card-bg); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: var(--radius);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.logo {
  font-size: 1.3rem; font-weight: 900;
  background: linear-gradient(135deg, #fbbf24, #ef4444);
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}

.box {
  background: var(--card-bg); backdrop-filter: blur(16px);
  border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; margin-bottom: 20px;
}

button, input, select {
  font: inherit; color: inherit; border: 1px solid var(--border);
  border-radius: 12px; padding: 12px 14px; background: rgba(31, 41, 55, 0.5);
  transition: all 0.2s ease;
}
button { cursor: pointer; font-weight: 700; }
button:active { transform: scale(0.97); }

.pri { background: linear-gradient(135deg, #ef4444, #b91c1c); border: none; color: #fff; }
.sec { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: #fff; }
.turbo-btn {
  background: linear-gradient(135deg, #10b981, #047857); border: none; color: #fff;
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
}

#cam {
  position: relative; margin-top: 12px; height: 320px;
  background: #000; border-radius: 14px; overflow: hidden;
  border: 2px solid var(--border);
}
#cam.active { border-color: var(--green); box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); }

#v { width: 100%; height: 100%; object-fit: cover; }
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center; padding-bottom: 20px;
  background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.7) 100%);
}
#target-box {
  width: 85%; height: 65px; border: 2px dashed var(--gold);
  background: rgba(251, 191, 36, 0.15); border-radius: 10px;
  box-shadow: 0 0 20px var(--gold-glow); pointer-events: none;
  transition: all 0.2s;
}
#target-box.success {
  border-color: var(--green); background: rgba(16, 185, 129, 0.3);
  box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
}

.scan-feed {
  display: flex; gap: 8px; overflow-x: auto; padding: 10px 0; margin-top: 10px;
}
.scan-feed img { height: 70px; border-radius: 6px; border: 1px solid var(--border); animation: popIn 0.2s ease; }

.stats-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 20px;
}
.stat-card {
  background: var(--card-bg); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 12px; text-align: center;
}
.stat-val { font-size: 1.25rem; font-weight: 800; color: var(--gold); }
.stat-lbl { font-size: 0.7rem; color: var(--mut); text-transform: uppercase; }

table { width: 100%; border-collapse: collapse; background: var(--card-bg); border-radius: var(--radius); overflow: hidden; }
td, th { padding: 10px 12px; border-bottom: 1px solid var(--border); text-align: left; font-size: 0.85rem; }
td input, td select { padding: 6px; width: 100%; font-size: 0.85rem; }

.badge { font-size: 0.7rem; padding: 2px 8px; border-radius: 20px; background: rgba(255,255,255,0.08); color: var(--mut); }

@keyframes popIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ PokeVault Zero</div>
  <span class="badge" style="border: 1px solid var(--green); color: var(--green)">TURBO STREAM</span>
</header>

<div class="box">
  <button id="turbo" class="turbo-btn" style="width:100%; font-size:1rem; padding:14px">⚡ AVVIA MULTI-SCANSIONE CONTINUA</button>

  <div id="cam" hidden>
    <video id="v" autoplay playsinline muted></video>
    <div id="overlay"><div id="target-box"></div></div>
  </div>

  <p id="st" style="margin-top:10px; font-size:0.85rem; color:var(--mut)">Attiva la modalità continua per passare le carte una dietro l'altra senza fermarti.</p>

  <div id="feed" class="scan-feed"></div>
</div>

<div class="stats-grid">
  <div class="stat-card"><div id="st-qty" class="stat-val">0</div><div class="stat-lbl">Carte</div></div>
  <div class="stat-card"><div id="st-mkt" class="stat-val">0.00 €</div><div class="stat-lbl">Valore Mercato</div></div>
  <div class="stat-card"><div id="st-tot" class="stat-val" style="color:var(--green)">0.00 €</div><div class="stat-lbl">Totale Vendita</div></div>
</div>

<h2 style="font-size: 1.1rem; margin-bottom: 12px">Registro Collezione</h2>
<table>
  <thead>
    <tr><th>Carta</th><th>Cond.</th><th>Mercato</th><th>Vendo a</th><th></th></tr>
  </thead>
  <tbody id="list"></tbody>
</table>

<div style="display:flex; gap:10px; margin-top:20px">
  <button id="csv">Esporta CSV</button>
  <button id="pdf">Stampa PDF</button>
  <button id="clr" style="margin-left:auto; border-color:var(--red); color:var(--red)">Svuota</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=id=>document.getElementById(id);
const eur=v=>v==null||isNaN(v)?'—':Number(v).toFixed(2)+' €';
let L=[];
try{L=JSON.parse(localStorage.getItem('pokevault_turbo')||'[]')}catch(e){}
const save=()=>{try{localStorage.setItem('pokevault_turbo',JSON.stringify(L))}catch(e){}draw()};

// Audio Beep per feedback istantaneo
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
function beep() {
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 880; // Nota La
    gain.gain.value = 0.1;
    osc.start(); osc.stop(audioCtx.currentTime + 0.12);
  } catch(e){}
}

/* ---------- Engine OCR Veloce ---------- */
let W=null;
async function getWorker(){
  if(!W){
    W=await Tesseract.createWorker('eng');
    await W.setParameters({
      tessedit_char_whitelist:'0123456789/',
      tessedit_pageseg_mode:Tesseract.PSM.SINGLE_LINE
    });
  }
  return W;
}

function otsuBinarize(ctx, w, h) {
  const imgData = ctx.getImageData(0, 0, w, h);
  const data = imgData.data;
  const hist = new Array(256).fill(0);
  for (let i = 0; i < data.length; i += 4) {
    const g = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    data[i] = data[i+1] = data[i+2] = g; hist[g]++;
  }
  let sum = 0; for (let t = 0; t < 256; t++) sum += t * hist[t];
  let sumB = 0, wB = 0, wF = 0, varMax = 0, thresh = 128, total = w * h;
  for (let t = 0; t < 256; t++) {
    wB += hist[t]; if (wB === 0) continue;
    wF = total - wB; if (wF === 0) break;
    sumB += t * hist[t];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const v = wB * wF * Math.pow(mB - mF, 2);
    if (v > varMax) { varMax = v; thresh = t; }
  }
  for (let i = 0; i < data.length; i += 4) {
    const val = data[i] >= thresh ? 255 : 0;
    data[i] = data[i+1] = data[i+2] = val;
  }
  ctx.putImageData(imgData, 0, 0);
}

function cropRegion(src, sw, sh) {
  const ch = sh * 0.28, cw = sw * 0.9;
  const c = document.createElement('canvas');
  c.width = Math.round(cw); c.height = Math.round(ch);
  const x = c.getContext('2d', {willReadFrequently: true});
  x.drawImage(src, sw * 0.05, sh * 0.70, cw, ch, 0, 0, c.width, c.height);
  otsuBinarize(x, c.width, c.height);
  return c;
}

async function readNum(src, sw, sh) {
  const w = await getWorker();
  const cvs = cropRegion(src, sw, sh);
  const res = await w.recognize(cvs);
  const clean = res.data.text.replace(/\s+/g, '');
  const match = clean.match(/(\d{1,3})\/(\d{2,3})/);
  return match ? `${match[1]}/${match[2]}` : '';
}

/* ---------- Gestione Auto-Fetch TCGdex ---------- */
let SETS = null;
async function fetchJSON(u){try{const r=await fetch(u);return r.ok?await r.json():null}catch(e){return null}}

async function autoAddCard(numStr) {
  const BASE = 'https://api.tcgdex.net/v2/en/';
  const m = numStr.match(/(\d+)\/(\d+)/);
  if (!m) return;
  
  const cardNum = +m[1], totalNum = +m[2];
  if (!SETS) SETS = await fetchJSON(BASE + 'sets') || [];
  
  const matchingSets = SETS.filter(s => s.cardCount && (s.cardCount.official === totalNum || s.cardCount.total === totalNum));
  for (const s of matchingSets) {
    for (const id of [String(cardNum).padStart(3, '0'), String(cardNum)]) {
      const c = await fetchJSON(BASE + 'cards/' + s.id + '-' + id);
      if (c) {
        const cm = (c.pricing && c.pricing.cardmarket) || {};
        const price = cm.trend ?? cm['trend-holo'] ?? 0;
        const setTotal = c.set && c.set.cardCount ? c.set.cardCount.official : totalNum;
        
        L.push({ name: c.name, set: c.set ? c.set.name : '', num: c.localId + '/' + setTotal, cond: 'NM', mkt: price, val: price });
        save();
        
        // Aggiungi all'anteprima rapida
        if (c.image) {
          const img = document.createElement('img');
          img.src = c.image + '/low.webp';
          $('feed').prepend(img);
        }
        return;
      }
    }
  }
}

/* ---------- Ciclo Scansione Continua (Turbo Stream) ---------- */
let stream = null, timer = 0, busy = false, lastAdded = '', lastTime = 0;

function stopTurbo() {
  clearInterval(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; $('cam').hidden = true; $('cam').classList.remove('active');$('turbo').textContent = '⚡ AVVIA MULTI-SCANSIONE CONTINUA';
  $('turbo').className = 'turbo-btn';
}

$('turbo').onclick = async () => {
  if (stream) { stopTurbo(); return; }
  
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }
    });
  } catch (e) { alert('Impossibile accedere alla fotocamera: ' + e.message); return; }
  
  const v = $('v');$('cam').hidden = false; $('cam').classList.add('active');$('turbo').textContent = '⏹ FERMA SCANSIONE';
  $('turbo').className = 'pri';
  v.srcObject = stream; await v.play();
  
  $('st').textContent = '🔥 Modalità Turbo Attiva: passa le carte davanti all\'obiettivo una dietro l\'altra!';
  await getWorker();
  
  timer = setInterval(async () => {
    if (busy || !stream || !v.videoWidth) return;
    busy = true;
    try {
      const code = await readNum(v, v.videoWidth, v.videoHeight);
      const now = Date.now();
      
      // Rilevamento valido e buffer anti-duplicato (2.5 secondi di pausetta se è la stessa carta)
      if (code && (code !== lastAdded || (now - lastTime) > 2500)) {
        lastAdded = code;
        lastTime = now;
        
        // Effetto grafico e sonoro immediato
        beep();
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);
        $('target-box').classList.add('success');
        setTimeout(() => $('target-box').classList.remove('success'), 300);$('st').textContent = '⚡ Trovato ' + code + '! Aggiunta in corso... Passo alla prossima!';
        
        // Aggiungi in background senza fermare la camera
        autoAddCard(code);
      }
    } catch(e) {}
    busy = false;
  }, 400); // Frequenza di campionamento ultra-veloce a 400ms
};

/* ---------- Render Tabella ---------- */
function draw() {
  $('list').innerHTML = '';
  let sumMkt = 0, sumVal = 0;
  
  L.forEach((c, i) => {
    sumMkt += (c.mkt || 0); sumVal += (c.val || 0);
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><b>${c.name}</b><br><span class="badge">${c.set} ${c.num}</span></td>
      <td>
        <select style="background:transparent">
          ${['NM','EX','GD','PL','PO'].map(x => `<option ${x === c.cond ? 'selected' : ''} style="background:#111827">${x}</option>`).join('')}
        </select>
      </td>
      <td>${eur(c.mkt)}</td>
      <td><input type="number" step="0.5" value="${c.val ?? ''}" style="background:transparent"></td>
      <td><button style="border:none; background:transparent; color:var(--red)">✕</button></td>
    `;
    tr.querySelector('select').onchange = e => { c.cond = e.target.value; save(); };
    tr.querySelector('input').onchange = e => { c.val = e.target.value === '' ? null : +e.target.value; save(); };
    tr.querySelector('button').onclick = () => { L.splice(i, 1); save(); };
    $('list').append(tr);
  });
  
  $('st-qty').textContent = L.length;
  $('st-mkt').textContent = eur(sumMkt);$('st-tot').textContent = eur(sumVal);
}

$('csv').onclick = () => {
  const rows = [['Nome Carta', 'Set', 'Numero', 'Condizione', 'Prezzo Mercato', 'Prezzo Vendita'], ...L.map(c => [c.name, c.set, c.num, c.cond, c.mkt ?? '', c.val ?? ''])];
  const csvStr = rows.map(r => r.map(x => `"${String(x).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csvStr], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'PokeVault_Collection.csv'; a.click();
};
$('pdf').onclick = () => print();$('clr').onclick = () => { if (confirm('Svuotare tutta la lista salvata?')) { L = []; save(); } };

draw();
</script>
</body>
</html>
