<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>PokeVault Zero — Turbo Stream Edition</title>
<style>
/* ==========================================================================
   1. STILI E TEMA VISIVO (GLASSMORPHISM & DARK AMBIENT)
   ========================================================================== */
:root {
  --bg-color: #030712;                   /* Sfondo scuro AMOLED */
  --panel-bg: rgba(17, 24, 39, 0.75);    /* Effetto vetro semi-trasparente */
  --panel-border: rgba(255, 255, 255, 0.1);
  --text-primary: #f9fafb;               /* Testo principale */
  --text-muted: #9ca3af;                 /* Testo secondario/dettagli */
  --accent-gold: #fbbf24;                /* Giallo oro per evidenziazioni */
  --accent-gold-glow: rgba(251, 191, 36, 0.35);
  --color-danger: #ef4444;               /* Rosso per azioni distruttive o arresto */
  --color-success: #10b981;              /* Verde per conferme e azioni principali */
  --color-info: #3b82f6;                 /* Blu per elementi informativi */
  --border-radius: 16px;
}

* { 
  box-sizing: border-box; 
  -webkit-tap-highlight-color: transparent; 
}

body {
  margin: 0; 
  padding: 16px; 
  max-width: 760px; 
  margin-inline: auto;
  background: var(--bg-color); 
  color: var(--text-primary);
  /* Sfondo con sfumatura radiale soffusa */
  background-image: 
    radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(245, 158, 11, 0.12) 0px, transparent 50%);
  background-attachment: fixed;
  font: 15px/1.5 system-ui, -apple-system, sans-serif;
}

/* Intestazione principale dell'app */
header {
  display: flex; 
  align-items: center; 
  justify-content: space-between;
  margin-bottom: 16px; 
  padding: 14px 18px;
  background: var(--panel-bg); 
  backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border); 
  border-radius: var(--border-radius);
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
}

.brand-logo {
  font-size: 1.3rem; 
  font-weight: 900;
  background: linear-gradient(135deg, #fbbf24, #ef4444);
  -webkit-background-clip: text; 
  -webkit-text-fill-color: transparent;
}

/* Riquadri dei moduli principali */
.content-box {
  background: var(--panel-bg); 
  backdrop-filter: blur(16px);
  border: 1px solid var(--panel-border); 
  border-radius: var(--border-radius);
  padding: 16px; 
  margin-bottom: 20px;
}

/* Controlli di input e pulsanti interattivi */
button, input, select {
  font: inherit; 
  color: inherit; 
  border: 1px solid var(--panel-border);
  border-radius: 12px; 
  padding: 12px 14px; 
  background: rgba(31, 41, 55, 0.5);
  transition: all 0.2s ease;
}

button { 
  cursor: pointer; 
  font-weight: 700; 
}

button:active { 
  transform: scale(0.97); 
}

/* Varianti dei pulsanti */
.btn-primary { background: linear-gradient(135deg, #ef4444, #b91c1c); border: none; color: #fff; }
.btn-secondary { background: linear-gradient(135deg, #3b82f6, #1d4ed8); border: none; color: #fff; }
.btn-turbo {
  background: linear-gradient(135deg, #10b981, #047857); 
  border: none; 
  color: #fff;
  box-shadow: 0 4px 20px rgba(16, 185, 129, 0.4);
}

.row {
  display: flex;
  gap: 8px;
  margin-top: 12px;
  flex-wrap: wrap;
}

.row input {
  flex: 1;
  min-width: 130px;
}

/* Riquadro del mirino della fotocamera */
#camera-wrapper {
  position: relative; 
  margin-top: 12px; 
  height: 320px;
  background: #000; 
  border-radius: 14px; 
  overflow: hidden;
  border: 2px solid var(--panel-border);
}

#camera-wrapper.is-scanning { 
  border-color: var(--color-success); 
  box-shadow: 0 0 20px rgba(16, 185, 129, 0.3); 
}

#video-preview { 
  width: 100%; 
  height: 100%; 
  object-fit: cover; 
}

/* Sovrapposizione grafica della fotocamera (Guida visiva) */
#camera-overlay {
  position: absolute; 
  inset: 0;
  display: flex; 
  flex-direction: column; 
  justify-content: flex-end; 
  align-items: center; 
  padding-bottom: 20px;
  background: radial-gradient(circle, transparent 50%, rgba(0,0,0,0.7) 100%);
}

#target-box {
  width: 85%; 
  height: 65px; 
  border: 2px dashed var(--accent-gold);
  background: rgba(251, 191, 36, 0.15); 
  border-radius: 10px;
  box-shadow: 0 0 20px var(--accent-gold-glow); 
  pointer-events: none;
  transition: all 0.2s;
}

/* Animazione visiva al successo del riconoscimento */
#target-box.read-success {
  border-color: var(--color-success); 
  background: rgba(16, 185, 129, 0.3);
  box-shadow: 0 0 30px rgba(16, 185, 129, 0.6);
}

/* Gallerie in tempo reale per le anteprime caricate */
.scan-feed {
  display: flex; 
  gap: 8px; 
  overflow-x: auto; 
  padding: 10px 0; 
  margin-top: 10px;
}

.scan-feed img { 
  height: 70px; 
  border-radius: 6px; 
  border: 1px solid var(--panel-border); 
  animation: popIn 0.2s ease; 
}

/* Griglia con le statistiche della collezione */
.stats-grid {
  display: grid; 
  grid-template-columns: repeat(3, 1fr); 
  gap: 10px; 
  margin-bottom: 20px;
}

.stat-card {
  background: var(--panel-bg); 
  border: 1px solid var(--panel-border);
  border-radius: var(--border-radius); 
  padding: 12px; 
  text-align: center;
}

.stat-value { 
  font-size: 1.25rem; 
  font-weight: 800; 
  color: var(--accent-gold); 
}

.stat-label { 
  font-size: 0.7rem; 
  color: var(--text-muted); 
  text-transform: uppercase; 
}

/* Tabella con i dati delle carte */
table { 
  width: 100%; 
  border-collapse: collapse; 
  background: var(--panel-bg); 
  border-radius: var(--border-radius); 
  overflow: hidden; 
}

td, th { 
  padding: 10px 12px; 
  border-bottom: 1px solid var(--panel-border); 
  text-align: left; 
  font-size: 0.85rem; 
}

td input, td select { 
  padding: 6px; 
  width: 100%; 
  font-size: 0.85rem; 
}

.badge { 
  font-size: 0.7rem; 
  padding: 2px 8px; 
  border-radius: 20px; 
  background: rgba(255,255,255,0.08); 
  color: var(--text-muted); 
}

@keyframes popIn { 
  from { transform: scale(0.5); opacity: 0; } 
  to { transform: scale(1); opacity: 1; } 
}
</style>
</head>
<body>

<!-- INTESTAZIONE APP -->
<header>
  <div class="brand-logo">⚡ PokeVault Zero</div>
  <span class="badge" style="border: 1px solid var(--color-success); color: var(--color-success)">TURBO STREAM</span>
</header>

<!-- PANNELLO DI SCANSIONE CONTINUA E INSERIMENTO MANUALE -->
<div class="content-box">
  <button id="btn-toggle-stream" class="btn-turbo" style="width:100%; font-size:1rem; padding:14px">
    ⚡ AVVIA MULTI-SCANSIONE CONTINUA
  </button>

  <!-- Area flusso video fotocamera -->
  <div id="camera-wrapper" hidden>
    <video id="video-preview" autoplay playsinline muted></video>
    <div id="camera-overlay">
      <div id="target-box"></div>
    </div>
  </div>

  <p id="status-message" style="margin-top:10px; font-size:0.85rem; color:var(--text-muted)">
    Usa la fotocamera in continuo oppure inserisci il numero o il nome qui sotto se non viene letta.
  </p>

  <!-- BARRA DI INSERIMENTO MANUALE (Alternativa o supporto al multi-scatto) -->
  <div class="row">
    <input id="input-manual-name" placeholder="Nome (es. Pikachu, opzionale)">
    <input id="input-manual-num" placeholder="Numero es. 025/165">
    <button id="btn-manual-search" class="btn-secondary" style="min-width: 90px">Cerca</button>
  </div>

  <!-- Anteprima rapida per le carte lette nella sessione corrente -->
  <div id="preview-feed" class="scan-feed"></div>
</div>

<!-- DASHBOARD DELLE STATISTICHE -->
<div class="stats-grid">
  <div class="stat-card">
    <div id="stat-count" class="stat-value">0</div>
    <div class="stat-label">Carte Salvate</div>
  </div>
  <div class="stat-card">
    <div id="stat-market-value" class="stat-value">0.00 €</div>
    <div class="stat-label">Valore di Mercato</div>
  </div>
  <div class="stat-card">
    <div id="stat-sale-total" class="stat-value" style="color:var(--color-success)">0.00 €</div>
    <div class="stat-label">Incasso Previsto</div>
  </div>
</div>

<!-- TABELLA RACCOGLITORE -->
<h2 style="font-size: 1.1rem; margin-bottom: 12px">Registro Collezione</h2>
<table>
  <thead>
    <tr>
      <th>Carta</th>
      <th>Condizione</th>
      <th>Mercato (€)</th>
      <th>Mio Prezzo (€)</th>
      <th></th>
    </tr>
  </thead>
  <tbody id="collection-list-body"></tbody>
</table>

<!-- PULSANTI DI ESPORTAZIONE E SVUOTAMENTO -->
<div style="display:flex; gap:10px; margin-top:20px">
  <button id="btn-export-csv">Esporta CSV</button>
  <button id="btn-print-pdf">Stampa PDF</button>
  <button id="btn-clear-all" style="margin-left:auto; border-color:var(--color-danger); color:var(--color-danger)">Svuota Lista</button>
</div>

<!-- Tesseract.js (Motore OCR basato su WebAssembly) -->
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>

<script>
/* ==========================================================================
   2. GESTIONE STATO LOCALE E FUNZIONI UTILITY
   ========================================================================== */

const getEl = id => document.getElementById(id);
const formatEuro = val => (val == null || isNaN(val)) ? '—' : Number(val).toFixed(2) + ' €';

let collectionList = [];

try {
  collectionList = JSON.parse(localStorage.getItem('pokevault_turbo_db') || '[]');
} catch (e) {
  console.warn("Impossibile caricare i dati salvati dal local storage", e);
}

const saveAndRefreshList = () => {
  try {
    localStorage.setItem('pokevault_turbo_db', JSON.stringify(collectionList));
  } catch (e) {
    console.error("Errore durante il salvataggio dei dati", e);
  }
  renderCollectionTable();
};

/* ==========================================================================
   3. FEEDBACK AUDIO (SUONO BEEP)
   ========================================================================== */

const audioContext = new (window.AudioContext || window.webkitAudioContext)();

function playSuccessBeep() {
  try {
    const oscillator = audioContext.createOscillator();
    const gainNode = audioContext.createGain();
    
    oscillator.connect(gainNode);
    gainNode.connect(audioContext.destination);
    
    oscillator.frequency.value = 880;
    gainNode.gain.value = 0.1;
    
    oscillator.start();
    oscillator.stop(audioContext.currentTime + 0.12);
  } catch (e) {}
}

/* ==========================================================================
   4. INIZIALIZZAZIONE OCR E PRE-PROCESSING IMMAGINE (ALGORITMO DI OTSU)
   ========================================================================== */

let tesseractWorker = null;

async function getOCRWorker() {
  if (!tesseractWorker) {
    tesseractWorker = await Tesseract.createWorker('eng');
    await tesseractWorker.setParameters({
      tessedit_char_whitelist: '0123456789/',
      tessedit_pageseg_mode: Tesseract.PSM.SINGLE_LINE
    });
  }
  return tesseractWorker;
}

function applyOtsuThresholding(context, width, height) {
  const imgData = context.getImageData(0, 0, width, height);
  const data = imgData.data;
  const histogram = new Array(256).fill(0);

  for (let i = 0; i < data.length; i += 4) {
    const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    data[i] = data[i+1] = data[i+2] = gray;
    histogram[gray]++;
  }

  let sum = 0;
  for (let t = 0; t < 256; t++) sum += t * histogram[t];

  let sumBackground = 0, weightBackground = 0, weightForeground = 0;
  let maxVariance = 0, optimalThreshold = 128, totalPixels = width * height;

  for (let t = 0; t < 256; t++) {
    weightBackground += histogram[t];
    if (weightBackground === 0) continue;

    weightForeground = totalPixels - weightBackground;
    if (weightForeground === 0) break;

    sumBackground += t * histogram[t];
    const meanBackground = sumBackground / weightBackground;
    const meanForeground = (sum - sumBackground) / weightForeground;

    const betweenClassVariance = weightBackground * weightForeground * Math.pow(meanBackground - meanForeground, 2);
    if (betweenClassVariance > maxVariance) {
      maxVariance = betweenClassVariance;
      optimalThreshold = t;
    }
  }

  for (let i = 0; i < data.length; i += 4) {
    const binaryValue = data[i] >= optimalThreshold ? 255 : 0;
    data[i] = data[i+1] = data[i+2] = binaryValue;
  }
  
  context.putImageData(imgData, 0, 0);
}

function cropLowerCardRegion(videoSource, sourceWidth, sourceHeight) {
  const cropHeight = sourceHeight * 0.28;
  const cropWidth = sourceWidth * 0.9;

  const canvas = document.createElement('canvas');
  canvas.width = Math.round(cropWidth);
  canvas.height = Math.round(cropHeight);
  
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(videoSource, sourceWidth * 0.05, sourceHeight * 0.70, cropWidth, cropHeight, 0, 0, canvas.width, canvas.height);
  
  applyOtsuThresholding(ctx, canvas.width, canvas.height);
  return canvas;
}

async function scanCardNumber(videoSource, sourceWidth, sourceHeight) {
  const worker = await getOCRWorker();
  const processedCanvas = cropLowerCardRegion(videoSource, sourceWidth, sourceHeight);
  
  const recognitionResult = await worker.recognize(processedCanvas);
  const cleanText = recognitionResult.data.text.replace(/\s+/g, '');
  
  const match = cleanText.match(/(\d{1,3})\/(\d{2,3})/);
  return match ? `${match[1]}/${match[2]}` : '';
}

/* ==========================================================================
   5. INTERROGAZIONE API DATABASE (TCGdex - Supporto Numero e Nome)
   ========================================================================== */

let cachedSetDatabase = null;

async function fetchJSONData(url) {
  try {
    const response = await fetch(url);
    return response.ok ? await response.json() : null;
  } catch (e) {
    return null;
  }
}

/**
 * Cerca la carta sul database TCGdex gestendo sia la ricerca tramite numero (es. 025/165) 
 * sia la ricerca testuale per nome.
 */
async function searchAndAddCard(cardNumberString, cardNameString = '') {
  const API_BASE_URL = 'https://api.tcgdex.net/v2/en/';
  const match = cardNumberString ? cardNumberString.match(/(\d+)\/(\d+)/) : null;

  try {
    let cardDetails = null;

    if (match) {
      const cardLocalNumber = +match[1];
      const setTotalCount = +match[2];

      if (!cachedSetDatabase) {
        cachedSetDatabase = await fetchJSONData(API_BASE_URL + 'sets') || [];
      }

      const matchingSets = cachedSetDatabase.filter(set => 
        set.cardCount && (set.cardCount.official === setTotalCount || set.cardCount.total === setTotalCount)
      );

      for (const setItem of matchingSets) {
        for (const formattedId of [String(cardLocalNumber).padStart(3, '0'), String(cardLocalNumber)]) {
          cardDetails = await fetchJSONData(API_BASE_URL + 'cards/' + setItem.id + '-' + formattedId);
          if (cardDetails) break;
        }
        if (cardDetails) break;
      }
    } else if (cardNameString) {
      // Ricerca per nome testuale se il numero non è formattato correttamente
      const searchResults = await fetchJSONData(API_BASE_URL + 'cards?name=' + encodeURIComponent(cardNameString) + '&pagination:page=1&pagination:itemsPerPage=1');
      if (searchResults && searchResults.length > 0) {
        cardDetails = await fetchJSONData(API_BASE_URL + 'cards/' + searchResults[0].id);
      }
    }

    if (cardDetails) {
      const pricingInfo = (cardDetails.pricing && cardDetails.pricing.cardmarket) || {};
      const marketPrice = pricingInfo.trend ?? pricingInfo['trend-holo'] ?? 0;
      const officialTotal = cardDetails.set && cardDetails.set.cardCount ? cardDetails.set.cardCount.official : '—';

      collectionList.push({
        name: cardDetails.name,
        set: cardDetails.set ? cardDetails.set.name : '',
        num: cardDetails.localId + '/' + officialTotal,
        cond: 'NM',
        mkt: marketPrice,
        val: marketPrice
      });

      saveAndRefreshList();

      if (cardDetails.image) {
        const previewImg = document.createElement('img');
        previewImg.src = cardDetails.image + '/low.webp';
        getEl('preview-feed').prepend(previewImg);
      }
      
      getEl('status-message').textContent = `✅ Aggiunta: ${cardDetails.name} (${cardDetails.localId}/${officialTotal})`;
      return true;
    } else {
      getEl('status-message').textContent = `❌ Nessuna carta trovata con i parametri inseriti.`;
      return false;
    }
  } catch (err) {
    getEl('status-message').textContent = `⚠️ Errore di ricerca: ${err.message}`;
    return false;
  }
}

/* ==========================================================================
   6. GESTIONE DELLA MULTI-SCANSIONE CONTINUA E INPUT MANUALE
   ========================================================================== */

let mediaStream = null;
let scanIntervalTimer = 0;
let isProcessingFrame = false;
let lastDetectedCode = '';
let lastDetectionTimestamp = 0;

function stopContinuousScan() {
  clearInterval(scanIntervalTimer);
  if (mediaStream) {
    mediaStream.getTracks().forEach(track => track.stop());
  }
  mediaStream = null;
  
  getEl('camera-wrapper').hidden = true;
  getEl('camera-wrapper').classList.remove('is-scanning');
  
  getEl('btn-toggle-stream').textContent = '⚡ AVVIA MULTI-SCANSIONE CONTINUA';
  getEl('btn-toggle-stream').className = 'btn-turbo';
}

getEl('btn-toggle-stream').onclick = async () => {
  if (mediaStream) {
    stopContinuousScan();
    return;
  }

  try {
    mediaStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment', width: { ideal: 1280 } }
    });
  } catch (err) {
    alert('Impossibile accedere alla fotocamera: ' + err.message);
    return;
  }

  const videoElement = getEl('video-preview');
  getEl('camera-wrapper').hidden = false;
  getEl('camera-wrapper').classList.add('is-scanning');

  getEl('btn-toggle-stream').textContent = '⏹ FERMA SCANSIONE';
  getEl('btn-toggle-stream').className = 'btn-primary';

  videoElement.srcObject = mediaStream;
  await videoElement.play();

  getEl('status-message').textContent = '🔥 Scansione attiva: passa le carte una dietro l\'altra nel mirino!';
  await getOCRWorker();

  scanIntervalTimer = setInterval(async () => {
    if (isProcessingFrame || !mediaStream || !videoElement.videoWidth) return;
    
    isProcessingFrame = true;
    try {
      const detectedCode = await scanCardNumber(videoElement, videoElement.videoWidth, videoElement.videoHeight);
      const nowTimestamp = Date.now();

      if (detectedCode && (detectedCode !== lastDetectedCode || (nowTimestamp - lastDetectionTimestamp) > 2500)) {
        lastDetectedCode = detectedCode;
        lastDetectionTimestamp = nowTimestamp;

        playSuccessBeep();
        if (navigator.vibrate) navigator.vibrate([60, 40, 60]);

        const targetBox = getEl('target-box');
        targetBox.classList.add('read-success');
        setTimeout(() => targetBox.classList.remove('read-success'), 300);

        getEl('status-message').textContent = `⚡ Trovato ${detectedCode}! Inserito nel registro.`;
        searchAndAddCard(detectedCode, '');
      }
    } catch (e) {
      console.error("Errore durante l'elaborazione del frame video", e);
    }
    isProcessingFrame = false;
  }, 400);
};

// Gestione del pulsante di ricerca manuale per numero o nome
getEl('btn-manual-search').onclick = () => {
  const manualName = getEl('input-manual-name').value.trim();
  const manualNum = getEl('input-manual-num').value.trim();

  if (!manualName && !manualNum) {
    alert('Inserisci almeno un numero di carta (es. 025/165) o un nome.');
    return;
  }

  searchAndAddCard(manualNum, manualName);
  
  // Pulisci i campi dopo l'invio per facilitare l'inserimento successivo
  getEl('input-manual-num').value = '';
  getEl('input-manual-name').value = '';
};

/* ==========================================================================
   7. AGGIORNAMENTO DELL'INTERFACCIA E TABELLA DATI
   ========================================================================== */

function renderCollectionTable() {
  const tableBody = getEl('collection-list-body');
  tableBody.innerHTML = '';
  
  let totalMarketValue = 0;
  let totalSalesValue = 0;

  collectionList.forEach((cardItem, index) => {
    totalMarketValue += (cardItem.mkt || 0);
    totalSalesValue += (cardItem.val || 0);

    const row = document.createElement('tr');
    row.innerHTML = `
      <td>
        <b>${cardItem.name}</b><br>
        <span class="badge">${cardItem.set} ${cardItem.num}</span>
      </td>
      <td>
        <select style="background:transparent">
          ${['NM','EX','GD','PL','PO'].map(cond => `<option ${cond === cardItem.cond ? 'selected' : ''} style="background:#111827">${cond}</option>`).join('')}
        </select>
      </td>
      <td>
        <input type="number" step="0.5" class="input-mkt" value="${cardItem.mkt ?? ''}" style="background:transparent">
      </td>
      <td>
        <input type="number" step="0.5" class="input-val" value="${cardItem.val ?? ''}" style="background:transparent">
      </td>
      <td>
        <button class="btn-delete" style="border:none; background:transparent; color:var(--color-danger)">✕</button>
      </td>
    `;

    row.querySelector('select').onchange = (e) => {
      cardItem.cond = e.target.value;
      saveAndRefreshList();
    };

    row.querySelector('.input-mkt').onchange = (e) => {
      cardItem.mkt = e.target.value === '' ? 0 : Number(e.target.value);
      saveAndRefreshList();
    };

    row.querySelector('.input-val').onchange = (e) => {
      cardItem.val = e.target.value === '' ? null : Number(e.target.value);
      saveAndRefreshList();
    };

    row.querySelector('.btn-delete').onclick = () => {
      collectionList.splice(index, 1);
      saveAndRefreshList();
    };

    tableBody.append(row);
  });

  getEl('stat-count').textContent = collectionList.length;
  getEl('stat-market-value').textContent = formatEuro(totalMarketValue);
  getEl('stat-sale-total').textContent = formatEuro(totalSalesValue);
}

/* ==========================================================================
   8. ESPORTAZIONE DATI (CSV & PDF)
   ========================================================================== */

getEl('btn-export-csv').onclick = () => {
  const rows = [
    ['Nome Carta', 'Set', 'Numero', 'Condizione', 'Prezzo Mercato', 'Prezzo Vendita'],
    ...collectionList.map(c => [c.name, c.set, c.num, c.cond, c.mkt ?? '', c.val ?? ''])
  ];
  
  const csvContent = rows.map(r => r.map(cell => `"${String(cell).replace(/"/g, '""')}"`).join(';')).join('\n');
  const blob = new Blob(['\ufeff' + csvContent], { type: 'text/csv;charset=utf-8;' });
  
  const downloadLink = document.createElement('a');
  downloadLink.href = URL.createObjectURL(blob);
  downloadLink.download = 'Collezione_PokeVault.csv';
  downloadLink.click();
};

getEl('btn-print-pdf').onclick = () => window.print();
