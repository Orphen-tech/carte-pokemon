<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030712">
<title>PokeVault Zero — Ultimate Edition</title>
<style>
:root{--bg-color:#030712;--panel-bg:rgba(17,24,39,.85);--panel-border:rgba(255,255,255,.08);--text-primary:#f9fafb;--text-muted:#9ca3af;--accent-gold:#fbbf24;--accent-gold-glow:rgba(251,191,36,.4);--color-danger:#ef4444;--color-success:#10b981;--color-info:#3b82f6;--border-radius:16px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;padding:16px;max-width:760px;margin-inline:auto;background:var(--bg-color);color:var(--text-primary);background-image:radial-gradient(at 0% 0%,rgba(59,130,246,.18) 0px,transparent 50%),radial-gradient(at 100% 100%,rgba(245,158,11,.15) 0px,transparent 50%);background-attachment:fixed;font:15px/1.5 system-ui,-apple-system,sans-serif}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;padding:14px 18px;background:var(--panel-bg);backdrop-filter:blur(16px);border:1px solid var(--panel-border);border-radius:var(--border-radius);box-shadow:0 10px 30px rgba(0,0,0,.5)}
.brand-logo{font-size:1.3rem;font-weight:900;background:linear-gradient(135deg,#fbbf24,#ef4444);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.content-box{background:var(--panel-bg);backdrop-filter:blur(16px);border:1px solid var(--panel-border);border-radius:var(--border-radius);padding:16px;margin-bottom:20px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
button,input,select{font:inherit;color:inherit;border:1px solid var(--panel-border);border-radius:12px;padding:12px 14px;background:rgba(31,41,55,.5);transition:all .2s ease}
button{cursor:pointer;font-weight:700}button:active{transform:scale(.97)}
.btn-primary{background:linear-gradient(135deg,#ef4444,#b91c1c);border:none;color:#fff}
.btn-secondary{background:linear-gradient(135deg,#3b82f6,#1d4ed8);border:none;color:#fff}
.btn-turbo{background:linear-gradient(135deg,#10b981,#047857);border:none;color:#fff;box-shadow:0 4px 20px rgba(16,185,129,.4)}
.row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.row input{flex:1;min-width:130px}
#camera-wrapper{position:relative;margin-top:12px;height:320px;background:#000;border-radius:14px;overflow:hidden;border:2px solid var(--panel-border)}
#camera-wrapper[hidden]{display:none}
#camera-wrapper.is-scanning{border-color:var(--color-success);box-shadow:0 0 20px rgba(16,185,129,.3)}
#video-preview{width:100%;height:100%;object-fit:cover}
#camera-overlay{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding-bottom:15px;background:radial-gradient(circle,transparent 50%,rgba(0,0,0,.7) 100%);pointer-events:none}
#target-box{width:90%;height:80px;border:2px dashed var(--accent-gold);background:rgba(251,191,36,.15);border-radius:10px;box-shadow:0 0 20px var(--accent-gold-glow);pointer-events:none;transition:all .2s}
#target-box.read-success{border-color:var(--color-success);background:rgba(16,185,129,.3);box-shadow:0 0 30px rgba(16,185,129,.6)}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
.scan-feed{display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin-top:10px}
.scan-feed img{height:70px;border-radius:6px;border:1px solid var(--panel-border);animation:popIn .2s ease}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.stat-card{background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:var(--border-radius);padding:12px;text-align:center}
.stat-value{font-size:1.25rem;font-weight:800;color:var(--accent-gold)}
.stat-label{font-size:.7rem;color:var(--text-muted);text-transform:uppercase}
table{width:100%;border-collapse:collapse;background:var(--panel-bg);border-radius:var(--border-radius);overflow:hidden}
td,th{padding:10px 12px;border-bottom:1px solid var(--panel-border);text-align:left;font-size:.85rem}
td input,td select{padding:6px;width:100%;font-size:.85rem}
.th{width:34px;border-radius:4px;vertical-align:middle;margin-right:6px}
.badge{font-size:.7rem;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.08);color:var(--text-muted)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:9}#lightbox[hidden]{display:none}#lightbox img{max-width:96%;max-height:96%}
@keyframes popIn{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</head>
<body>

<header>

<div class="content-box">

  <p id="status-message" style="margin-top:10px;font-size:.85rem;color:var(--text-muted)">

  </p>

  <div class="row">

</div>

<div class="stats-grid">

  <div class="stat-card"><div id="stat-market-value" class="stat-value">0.00 €</div><div class="stat-label">Valore di Mercato</div></div>
  <div class="stat-card"><div id="stat-sale-total" class="stat-value" style="color:var(--color-success)">0.00 €</div><div class="stat-label">Incasso Previsto</div></div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
  <h2 style="font-size:1.1rem;margin:0">Registro Collezione</h2>
  <input id="search-filter" placeholder="Filtra collezione..." style="padding:6px 10px;font-size:.8rem;width:160px">
</div>

<table>
  <thead><tr><th>Carta</th><th>Condizione</th><th>Mercato (€)</th><th>Mio Prezzo (€)</th><th></th></tr></thead>
  <tbody id="collection-list-body"></tbody>
</table>

<div style="display:flex;gap:10px;margin-top:20px">
  <button id="btn-export-csv">Esporta CSV</button>
  <button id="btn-print-pdf">Stampa PDF</button>
  <button id="btn-clear-all" style="margin-left:auto;border-color:var(--color-danger);color:var(--color-danger)">Svuota Lista</button>
</div>

<div id="lightbox" hidden><img alt=""></div>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const getEl = id => document.getElementById(id);
const formatEuro = val => (val == null || isNaN(val)) ? '—' : Number(val).toFixed(2) + ' €';

let collectionList = [];
try { collectionList = JSON.parse(localStorage.getItem('pokevault_ultimate_db') || '[]'); } catch (e) { console.warn("Impossibile caricare i dati", e); }

const saveAndRefreshList = () => {
  try { localStorage.setItem('pokevault_ultimate_db', JSON.stringify(collectionList)); } catch (e) { console.error("Errore salvataggio", e); }
  renderCollectionTable();
};

/* --- Archivio foto (IndexedDB) --- */
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('pokevault', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('photos', { keyPath: 'id' });
  r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
});
const tx = async (mode, fn) => {
  const db = await dbp;
  return new Promise((res, rej) => {
    const t = db.transaction('photos', mode), q = fn(t.objectStore('photos'));
    t.oncomplete = () => res(q && q.result); t.onerror = () => rej(t.error);
  });
};
const putPhoto = p => tx('readwrite', s => s.put(p));
const getPhoto = id => tx('readonly', s => s.get(id));
const delPhoto = id => tx('readwrite', s => s.delete(id));
const clrPhotos = () => tx('readwrite', s => s.clear());
const urlCache = {};
async function photoURL(id) {
  if (urlCache[id]) return urlCache[id];
  const p = await getPhoto(id);
  return p ? (urlCache[id] = URL.createObjectURL(p.blob)) : null;
}

let pending = [];
try { pending = JSON.parse(localStorage.getItem('pokevault_pending') || '[]'); } catch (e) {}
function savePending() {
  renderPending();
  try { localStorage.setItem('pokevault_pending', JSON.stringify(pending)); } catch (e) {}
  getEl('btn-process').textContent = pending.length ? `🔎 Riconosci ${pending.length} foto` : '🔎 Riconosci foto';
}

/* --- Feedback Audio --- */
const audioContext = new (window.AudioContext || window.webkitAudioContext)();
function playSuccessBeep() {
  try {
    const osc = audioContext.createOscillator(), gain = audioContext.createGain();
    osc.connect(gain); gain.connect(audioContext.destination);
    osc.frequency.value = 880; gain.gain.value = 0.1;
    osc.start(); osc.stop(audioContext.currentTime + 0.12);
  } catch (e) {}
}

/* --- OCR & Preprocessing Ottimizzato --- */
let tesseractWorker = null;
async function getOCRWorker() {
  if (!tesseractWorker) {
    tesseractWorker = await Tesseract.createWorker('eng');
    await tesseractWorker.setParameters({ 
      tessedit_char_whitelist: '0123456789/', 
      tessedit_pageseg_mode: Tesseract.PSM.SPARSE_TEXT 
    });
  }
  return tesseractWorker;
}

function applyOtsuThresholding(context, width, height) {
  const imgData = context.getImageData(0, 0, width, height), data = imgData.data;
  const histogram = new Array(256).fill(0);
  for (let i = 0; i < data.length; i += 4) {
    const gray = Math.round(0.299 * data[i] + 0.587 * data[i+1] + 0.114 * data[i+2]);
    data[i] = data[i+1] = data[i+2] = gray; histogram[gray]++;
  }
  let sum = 0;
  for (let t = 0; t < 256; t++) sum += t * histogram[t];
  let sumBackground = 0, weightBackground = 0, weightForeground = 0, maxVariance = 0, optimalThreshold = 128, totalPixels = width * height;
  for (let t = 0; t < 256; t++) {
    weightBackground += histogram[t];
    if (weightBackground === 0) continue;
    weightForeground = totalPixels - weightBackground;
    if (weightForeground === 0) break;
    sumBackground += t * histogram[t];
    const meanBackground = sumBackground / weightBackground, meanForeground = (sum - sumBackground) / weightForeground;
    const v = weightBackground * weightForeground * Math.pow(meanBackground - meanForeground, 2);
    if (v > maxVariance) { maxVariance = v; optimalThreshold = t; }
  }
  for (let i = 0; i < data.length; i += 4) { const b = data[i] >= optimalThreshold ? 255 : 0; data[i] = data[i+1] = data[i+2] = b; }
  context.putImageData(imgData, 0, 0);
}

// Riduzione dell'area di analisi per maggiore precisione e velocità
const REG = [[0, 0.60, 1.0, 0.40]];
const REG2 = [[0, 0.60, 0.5, 0.40], [0.5, 0.60, 0.5, 0.40], [0, 0, 1, 1]];
let lastOCRText = '';

function prepRegion(src, sw, sh, [fx, fy, fw, fh], mode) {
  const cw = sw * fw, ch = sh * fh;
  // Limita la risoluzione massima a 600px per velocizzare l'OCR
  const targetW = Math.min(600, cw);
  const scale = targetW / cw;
  const c = document.createElement('canvas'); 
  c.width = targetW; 
  c.height = Math.round(ch * scale);
  const x = c.getContext('2d', { willReadFrequently: true });
  x.drawImage(src, sw * fx, sh * fy, cw, ch, 0, 0, c.width, c.height);
  
  if (mode === 2) { applyOtsuThresholding(x, c.width, c.height); return c; }
  
  const d = x.getImageData(0, 0, c.width, c.height), p = d.data; let lo = 255, hi = 0;
  for (let i = 0; i < p.length; i += 4) { const g = .3 * p[i] + .59 * p[i+1] + .11 * p[i+2]; p[i] = g; if (g < lo) lo = g; if (g > hi) hi = g; }
  const k = 255 / Math.max(hi - lo, 1);
  for (let i = 0; i < p.length; i += 4) { let g = (p[i] - lo) * k; if (mode === 1) g = 255 - g; p[i] = p[i+1] = p[i+2] = g; }
  x.putImageData(d, 0, 0); return c;
}

let lastGuess = '';
async function scanCardNumber(src, sw, sh, deep = false) {
  const worker = await getOCRWorker(), votes = {}; lastGuess = '';
  const regionsToScan = deep ? [...REG, ...REG2] : REG;
  const modesToScan = deep ? [0, 1, 2] : [0];

  for (const r of regionsToScan) {
    for (const m of modesToScan) {
      const t = (await worker.recognize(prepRegion(src, sw, sh, r, m))).data.text; 
      lastOCRText = t;
      const x = t.match(/(\d{1,3})\s*\/\s*(\d{2,3})/);
      if (!x) continue;
      const code = (+x[1]) + '/' + (+x[2]);
      if (!deep) return code;
      votes[code] = (votes[code] || 0) + 1;
      if (votes[code] >= 2) return code;
      if (!lastGuess) lastGuess = code;
    }
  }
  return '';
}

/* --- Lettura AI --- */
try { getEl('api-key').value = localStorage.getItem('pokevault_key') || ''; } catch (e) {}
getEl('api-key').onchange = () => { try { localStorage.setItem('pokevault_key', getEl('api-key').value.trim()); } catch (e) {} };
async function readAI(blob) {
  const bmp = await createImageBitmap(blob), sc = Math.min(1, 1400 / Math.max(bmp.width, bmp.height)), c = document.createElement('canvas');
  c.width = Math.round(bmp.width * sc); c.height = Math.round(bmp.height * sc);
  c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
  const data = c.toDataURL('image/jpeg', .85).split(',')[1];
  const r = await fetch('https://api.anthropic.com/v1/messages', { method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': getEl('api-key').value.trim(), 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: 'claude-haiku-4-5-20251001', max_tokens: 150, messages: [{ role: 'user', content: [
      { type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data } },
      { type: 'text', text: 'Questa è una carta Pokémon. Rispondi SOLO con JSON: {"name":"nome della carta","number":"numero di collezione es. 025","total":"totale del set es. 165"}. Usa "" per ciò che non riesci a leggere.' }] }] }) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error?.message || r.status);
  const o = JSON.parse(j.content[0].text.replace(/```json|
